site_name: Printer Definition Language (PDL)
site_description: Open, slicer-agnostic specification for defining 3D printers, materials, and processes.
site_url: https://monotoba.github.io/PrinterDefinitionLanguage/
repo_name: Monotoba/PrinterDefinitionLanguage
repo_url: https://github.com/Monotoba/PrinterDefinitionLanguage
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.tabs.link
    - toc.integrate
  palette:
    - scheme: default
      primary: blue
      accent: indigo

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Specification: PDL_SPEC.md
  - Examples:
      - Minimal: examples/minimal.yaml
      - LK5 Pro: examples/full_lk5pro.yaml
  - Schema: schema/pdl.schema.json
  - Slicer Support: slicer-support.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Monotoba/PrinterDefinitionLanguage
