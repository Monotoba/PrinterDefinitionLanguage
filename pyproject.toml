[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-definition-language"
version = "1.0.0"
description = "Schema and specification for the Printer Definition Language"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [{name = "Monotoba"}]
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []
